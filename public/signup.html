<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecureCam · Create account</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <div class="auth-wrap">
    <form class="auth-card" id="auth-form" data-mode="signup">
      <a class="brand" href="/"><img src="/logo-mark-96.png" alt="" width="30" height="30">SecureCam</a>
      <h1>Create an account</h1>
      <p>Add your own cameras and watch them from anywhere.</p>
      <a class="google-btn hidden" id="google-btn" href="/auth/google">Continue with Google</a>
      <div class="auth-divider hidden" id="google-divider">or</div>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" maxlength="254" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="new-password" minlength="7" maxlength="200" required>
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" autocomplete="new-password" minlength="7" maxlength="200" required>
      <div class="hint">At least 7 characters.</div>
      <button type="submit" class="primary">Create account</button>
      <div class="error" id="error" role="alert"></div>
      <div class="notice hidden" id="notice" role="status"></div>
      <div class="hint">By creating an account you agree to the <a class="plain-link" href="/privacy">Privacy Policy</a>.</div>
      <div class="auth-links">
        <a href="/login.html">Already have an account? Sign in</a>
        <button type="button" class="link-button" id="resend-btn">Resend confirmation</button>
      </div>
    </form>
  </div>
  <script src="/login.js"></script>
</body>
</html>
