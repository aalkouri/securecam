<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecureCam · Setup</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <div class="auth-wrap">
    <form class="auth-card" id="auth-form" data-mode="setup">
      <a class="brand" href="/"><img src="/logo-mark-96.png" alt="" width="30" height="30">SecureCam</a>
      <h1>Welcome</h1>
      <p>Create the admin account and the first building for your cameras.</p>
      <label for="building">Building</label>
      <input type="text" id="building" placeholder="Main Building" maxlength="100" required>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" maxlength="254" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="new-password" minlength="7" required>
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" autocomplete="new-password" minlength="7" required>
      <div class="hint">At least 7 characters.</div>
      <button type="submit" class="primary">Create account</button>
      <div class="error" id="error" role="alert"></div>
    </form>
  </div>
  <script src="/login.js"></script>
</body>
</html>
