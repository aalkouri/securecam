<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecureCam</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand"><span class="brand-dot"></span>SecureCam</div>
    <div class="actions">
      <div class="layout-toggle" id="layout-toggle" aria-label="Grid columns">
        <button data-cols="1" title="1 column">1</button>
        <button data-cols="2" title="2 columns">2</button>
        <button data-cols="3" title="3 columns">3</button>
      </div>
      <button class="primary" id="add-btn">+ Add camera</button>
      <button id="logout-btn">Sign out</button>
    </div>
  </header>

  <main>
    <div class="empty hidden" id="empty">
      <h2>No cameras yet</h2>
      <p>Add your first camera using its RTSP URL.<br>
        No hardware yet? Use <code>test://demo</code> to see a sample feed.</p>
      <button class="primary" id="empty-add-btn">+ Add camera</button>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <dialog id="cam-dialog">
    <form method="dialog" id="cam-form">
      <h2 id="dialog-title">Add camera</h2>
      <label for="cam-name">Name</label>
      <input type="text" id="cam-name" placeholder="Front door" maxlength="64" required>
      <label for="cam-url">Stream URL</label>
      <input type="text" id="cam-url" placeholder="rtsp://user:pass@192.168.1.50:554/stream1" required>
      <div class="hint">Check your camera's manual for its RTSP path. Use <code>test://demo</code> for a sample feed.</div>
      <label class="check"><input type="checkbox" id="cam-enabled" checked> Enabled</label>
      <label class="check"><input type="checkbox" id="cam-transcode"> Transcode to H.264 (use if the camera sends H.265 and video stays black)</label>
      <div class="error" id="cam-error" role="alert"></div>
      <div class="row">
        <button type="button" class="danger" id="cam-delete">Delete</button>
        <div class="right">
          <button type="button" id="cam-cancel">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </div>
    </form>
  </dialog>

  <template id="tile-template">
    <div class="tile">
      <div class="video-box">
        <video muted playsinline autoplay></video>
        <div class="overlay"></div>
      </div>
      <div class="bar">
        <span class="name"></span>
        <div class="tools">
          <span class="badge"></span>
          <button class="icon" data-action="fullscreen" title="Fullscreen">⛶</button>
          <button class="icon" data-action="restart" title="Restart stream">↻</button>
          <button class="icon" data-action="edit" title="Edit">✎</button>
        </div>
      </div>
    </div>
  </template>

  <script src="/vendor/hls.js/hls.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
