<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecureCam · Forgot password</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <div class="auth-wrap">
    <form class="auth-card" id="auth-form" data-mode="forgot">
      <div class="brand"><span class="brand-dot"></span>SecureCam</div>
      <h1>Forgot password</h1>
      <p>Enter your email and we will send you a link to choose a new password.</p>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" maxlength="254" required autofocus>
      <button type="submit" class="primary">Send reset link</button>
      <div class="error" id="error" role="alert"></div>
      <div class="notice hidden" id="notice" role="status"></div>
      <div class="auth-links"><a href="/login.html">Back to sign in</a></div>
    </form>
  </div>
  <script src="/login.js"></script>
</body>
</html>
