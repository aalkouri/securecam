<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecureCam · Sign in</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <div class="auth-wrap">
    <form class="auth-card" id="auth-form" data-mode="login">
      <a class="brand" href="/"><img src="/logo-mark-96.png" alt="" width="30" height="30">SecureCam</a>
      <h1>Sign in</h1>
      <p>Sign in to view your cameras.</p>
      <a class="google-btn hidden" id="google-btn" href="/auth/google">Continue with Google</a>
      <div class="auth-divider hidden" id="google-divider">or</div>
      <label for="username">Email</label>
      <input type="text" id="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit" class="primary">Sign in</button>
      <div class="error" id="error" role="alert"></div>
      <div class="notice hidden" id="notice" role="status"></div>
      <div class="auth-links">
        <a class="hidden" id="forgot-link" href="/forgot.html">Forgot password?</a>
        <a class="hidden" id="signup-link" href="/signup.html">Create an account</a>
      </div>
    </form>
  </div>
  <script src="/login.js"></script>
</body>
</html>
